<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1 data-i18n="extName"></h1>
  </header>

  <main>
    <section id="idle">
      <label for="title" data-i18n="popupSessionName"></label>
      <input id="title" type="text" data-i18n-placeholder="popupSessionPlaceholder">
      <button id="start" class="primary" data-i18n="popupStart"></button>
    </section>

    <section id="active" hidden>
      <p class="status"><span class="dot"></span><span id="status"></span></p>
      <p class="hint" data-i18n="popupHint"></p>
      <ol id="entries"></ol>
      <button id="stop" class="primary" data-i18n="popupStop"></button>
      <button id="discard" class="secondary" data-i18n="popupDiscard"></button>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
